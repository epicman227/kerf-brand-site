<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Kerf mark">
  <defs>
    <linearGradient id="kg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8F24D"/>
      <stop offset="0.55" stop-color="#1FB26A"/>
      <stop offset="1" stop-color="#0B5C44"/>
    </linearGradient>
    <mask id="kerfcut">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="30" y="-4" width="4.5" height="36" fill="#000" transform="rotate(38 32 32)"/>
    </mask>
  </defs>
  <g mask="url(#kerfcut)">
    <circle cx="32" cy="32" r="25" fill="none" stroke="url(#kg)" stroke-width="6"/>
    <circle cx="32" cy="32" r="14" fill="none" stroke="url(#kg)" stroke-width="4" opacity="0.9"/>
    <circle cx="32" cy="32" r="4" fill="url(#kg)"/>
  </g>
</svg>
